<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#fff">
    <!-- Google Font: Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="hsl(var(--background))" />
    <title>Live Achieve Believe</title>
    <script>
      (function() {
        var isHome = window.location.pathname === '/' || window.location.pathname === '';
        var seen = false;
        try {
          seen = sessionStorage.getItem('lab_preloader_seen') === 'true';
        } catch(e) {}
        if (isHome && !seen) {
          document.documentElement.style.backgroundColor = '#000000';
        } else {
          document.documentElement.style.backgroundColor = '#FAF4E6';
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #FAF4E6;">
    <div id="root">
      <!-- Instant 0ms Black Shutter: avoids any yellow screen flash before countdown -->
      <div id="initial-preloader" style="position:fixed;inset:0;z-index:99999;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;pointer-events:none;user-select:none;">
        <h1 style="color:#ffffff;font-size:clamp(28px,5vw,56px);font-weight:bold;letter-spacing:0.2em;text-transform:uppercase;margin:0 0 16px 0;text-align:center;">
          LIVE ACHIEVE BELIEVE
        </h1>
        <div style="font-family:monospace;color:#d6d3d1;font-size:20px;font-weight:300;">
          00<span style="font-size:12px;opacity:0.7;">%</span>
        </div>
      </div>
      <script>
        (function() {
          var isHome = window.location.pathname === '/' || window.location.pathname === '';
          var seen = false;
          try {
            seen = sessionStorage.getItem('lab_preloader_seen') === 'true';
          } catch(e) {}
          if (!isHome || seen) {
            var el = document.getElementById('initial-preloader');
            if (el) el.remove();
          }
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
